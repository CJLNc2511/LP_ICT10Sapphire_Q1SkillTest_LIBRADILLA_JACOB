<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"> </script>
    <title>Receipt Calculator</title>

    <style>

body {

background: linear-gradient(135deg, #fffde3, #cfc198);
min-height: 100vh;

}

.receipt-card {

background-color: #ded9a7;
text-align: center;
border: none;
border-radius: 5px;
overflow: hidden;
box-shadow: 0 10px 30px rgb(71, 64, 56);
max-width: 480px;
margin: 30px auto;
padding: 25px;

}

.footer{
    text-align: center;
}

.header {

background: #d4c282;
color: rgb(29, 26, 22);
border-radius: 2px;
padding: 30px;
text-align: center;

}


</style>

</head>
<body>
    <div class = "header">
    <h1>Milk Tea Shop</h1>

</div>

   <div class="receipt-card">

    <br>
    <p>Select the drink you wish to purchase:</p> <br>
    <form onsubmit="return false;">

        <label>
            <input type="checkbox" id="item1" value="100.00"> Signature Milk Tea
            <br>₱100.00
        </label><br> <br>
        <label>
            <input type="checkbox" id="item2" value="120.00"> Wintermelon Milk Tea
            <br> ₱120.00
            
        </label><br> <br>
        <label>
            <input type="checkbox" id="item3" value="120.00"> Strawberry Milk Tea
             <br>
             ₱120.00
        </label><br><br>
        <label>
            <input type="checkbox" id="item4" value="150.00"> Taro Milk Tea 
             <br>
             ₱150.00
        </label><br><br>
        <label>
            <input type="checkbox" id="item5" value="180.00"> Matcha Milk Tea
            <br>
             ₱180.00
        </label><br><br>
            <br>
            
        </form>

         <div id="footer">
         <button type="button" py-click="create_order">Generate Receipt</button> <Br>
         </div>

         <div id="show"></div>

           </div>

    <script type="py" src="./main.py"></script>

</body>
</html>
